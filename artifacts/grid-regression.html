<!doctype html><meta charset="utf-8"><title>Grid row sizing regression</title>
<style>body{margin:16px;background:#faf7f0;font:14px system-ui}#samples{display:grid;grid-template-columns:repeat(2,568px);gap:16px}iframe{width:568px;height:594px;border:0}pre{white-space:pre-wrap}</style>
<div id="samples"></div><pre id="results"></pre>
<script>
for(const n of [9,12]) for(const before of [true,false]) {
  const iframe=document.createElement('iframe');
  const override=before?'#board{grid-template-columns:repeat(var(--n),1fr);grid-template-rows:none}.cell{aspect-ratio:1;align-self:auto;justify-self:auto}':'';
  let cells='';for(let i=0;i<n*n;i++) cells+=`<button class="cell ${i%n===3?'edge-right':''} ${Math.floor(i/n)===2?'edge-bottom':''}" style="--color:#e8c7d4"></button>`;
  iframe.srcdoc=`<!doctype html><link rel="stylesheet" href="../style.css"><style>body{padding:0;margin:0}h2{margin:0;height:26px;font:14px system-ui}#board{width:564px;border-radius:0}${override}</style><h2>${n} × ${n} — ${before?'Before':'After'}</h2><div id="board" style="--n:${n}">${cells}</div>`;
  iframe.onload=()=>{
    const doc=iframe.contentDocument, cells=[...doc.querySelectorAll('.cell')];
    let rowGap=0,columnGap=0;
    cells.forEach((cell,i)=>{
      const rect=cell.getBoundingClientRect();
      if(i+n<cells.length)rowGap=Math.max(rowGap,cells[i+n].getBoundingClientRect().top-rect.bottom);
      if(i%n<n-1)columnGap=Math.max(columnGap,cells[i+1].getBoundingClientRect().left-rect.right);
    });
    document.querySelector('#results').textContent+=`${n} ${before?'Before':'After'}: max row gap ${rowGap.toFixed(5)}px, column gap ${columnGap.toFixed(5)}px\n`;
  };
  document.querySelector('#samples').append(iframe);
}
</script>
